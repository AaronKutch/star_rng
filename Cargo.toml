[package]
name = "star_rng"
version = "0.2.0"
edition = "2024"
# `flake.nix` and `ci.yml` read this automatically, but run `nix flake update`
# and fix any hashes. The pinned toolchain in `pinned-toolchain.toml` is
# bumped separately.
rust-version = "1.88"
authors = ["Aaron Kutch <aaronkutch@att.net>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/AaronKutch/star_rng"
documentation = "https://docs.rs/star_rng"
description = "opinionated PRNG for easier fuzz testing"
keywords = ["rng", "prng", "random"]
categories = ["algorithms", "no-std"]

[features]
default = []
awint_support = ["awint"]

[dependencies]
awint = { path = "./../awint/awint", optional = true, default-features = false }
#awint = { version = "0.18", optional = true, default-features = false }
rand_core = { version = "0.10" }
rand_xoshiro = { version = "0.8", default-features = false }

[dev-dependencies]
awint = { path = "./../awint/awint", default-features = false, features = ["alloc", "rand_support"] }
#awint = { version = "0.18", default-features = false, features = ["alloc", "rand_support"] }
