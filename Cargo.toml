[package]
name = "star_rng"
version = "0.2.0"
edition = "2021"
authors = ["Aaron Kutch <aaronkutch@att.net>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/AaronKutch/star_rng"
documentation = "https://docs.rs/star_rng"
description = "opinionated PRNG for easier fuzz testing"
keywords = ["rng", "prng", "random"]
categories = ["algorithms", "no-std"]

[dependencies]
#awint = { path = "./../awint/awint", default-features = false }
awint = { version = "0.18", default-features = false }
rand_xoshiro = { version = "0.7", default-features = false }
rand_core = { version = "0.9" }

[dev-dependencies]
#awint = { path = "./../awint/awint", default-features = false, features = ["alloc"]}
awint = { version = "0.18", default-features = false, features = ["alloc"] }
